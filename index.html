<script src="https://cdn.tailwindcss.com"></script>

<div class="flex flex-col h-screen bg-slate-50/90 text-slate-800 font-sans relative overflow-hidden justify-between">
  <!-- Soft Ambient Glow Orbs -->
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[30rem] h-[30rem] bg-gradient-to-tr from-indigo-200/35 via-sky-200/30 to-purple-200/35 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-10 left-10 w-64 h-64 bg-sky-200/20 rounded-full blur-2xl pointer-events-none"></div>

  <!-- Header Bar -->
  <header class="relative z-10 flex items-center justify-between px-5 py-4 bg-transparent">
    <button type="button" class="w-10 h-10 rounded-full bg-white/80 backdrop-blur-md border border-slate-200/80 shadow-sm shadow-indigo-500/5 flex items-center justify-center text-slate-600 hover:bg-white hover:text-indigo-600 transition-all active:scale-95">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <div class="text-center">
      <span class="block text-[10px] font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-sky-500 to-indigo-600 uppercase">
        PILGRIX
      </span>
      <h1 class="text-sm font-bold text-slate-900 leading-tight">
        AI Lab
      </h1>
    </div>

    <button type="button" class="w-10 h-10 rounded-full bg-white/80 backdrop-blur-md border border-slate-200/80 shadow-sm shadow-indigo-500/5 flex items-center justify-center text-slate-600 hover:bg-white hover:text-indigo-600 transition-all active:scale-95">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </button>
  </header>

  <!-- Canvas Workspace Area -->
  <main class="flex-1 relative z-10 flex flex-col justify-end p-4 max-w-xl mx-auto w-full gap-4">
    <!-- User Message Bubble -->
    <div class="self-end bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-md shadow-slate-900/10 border border-slate-800">
      Hi
    </div>

    <!-- Processing Status Card -->
    <div class="self-start bg-white/85 backdrop-blur-md border border-indigo-100/90 rounded-2xl p-4 shadow-xl shadow-indigo-500/5 max-w-xs w-full transition-all">
      <div class="flex items-center gap-2 mb-1">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
        </span>
        <p class="text-xs font-semibold text-slate-800">Processing session request...</p>
      </div>
      <p class="text-[11px] text-slate-500 pl-4 leading-relaxed">
        Applying motion keyframes and generating your video edit.
      </p>
    </div>
  </main>

  <!-- Floating Prompt Bar -->
  <footer class="relative z-10 p-4 max-w-xl mx-auto w-full pb-5">
    <div class="bg-white/90 backdrop-blur-xl border border-indigo-100/80 rounded-3xl p-4 shadow-xl shadow-indigo-500/10 flex flex-col gap-3">
      <input 
        type="text" 
        placeholder="Tell Pilgrix what you want to make..." 
        class="w-full bg-transparent border-none text-sm text-slate-800 placeholder-slate-400 focus:outline-none px-1"
      />

      <div class="flex items-center justify-between pt-1">
        <!-- Left Tools -->
        <div class="flex items-center gap-2">
          <button type="button" class="w-8 h-8 rounded-full bg-slate-100/80 hover:bg-slate-200/80 flex items-center justify-center text-slate-600 transition-all active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
          </button>

          <button type="button" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-gradient-to-r from-sky-50 to-indigo-50 border border-indigo-100/80 text-indigo-600 hover:border-indigo-200 transition-all text-xs font-semibold shadow-sm">
            <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.143-5.714L5 12l5.714-2.143L13 3z"></path>
            </svg>
            Magic Polish
          </button>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center gap-2">
          <button type="button" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
            </svg>
          </button>

          <button type="button" class="w-8 h-8 rounded-full bg-gradient-to-r from-slate-900 to-indigo-950 hover:from-slate-800 hover:to-indigo-900 flex items-center justify-center text-white transition-all shadow-md shadow-indigo-950/20 active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <p class="text-[11px] text-center text-slate-400/90 mt-2.5 font-medium">
      Your media stays attached to this edit session.
    </p>
  </footer>
</div>
